<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}API Test Report{% endblock %}</title>
    <link rel="stylesheet" href="file://{{ css_path }}"/>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; line-height: 1.6; color: #1a1a2e; background: #f8f9fa; }
        .container { max-width: 1200px; margin: 0 auto; padding: 2rem; }
        .header { text-align: center; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 2px solid #e0e0e0; }
        .header h1 { font-size: 2rem; font-weight: 700; color: #1a1a2e; margin-bottom: 0.5rem; }
        .header .meta { color: #666; font-size: 0.9rem; }
        .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .summary-card { background: white; border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: center; }
        .summary-card.total { border-top: 4px solid #3b82f6; }
        .summary-card.passed { border-top: 4px solid #22c55e; }
        .summary-card.failed { border-top: 4px solid #ef4444; }
        .summary-card.errors { border-top: 4px solid #f97316; }
        .summary-card.skipped { border-top: 4px solid #6b7280; }
        .summary-card.duration { border-top: 4px solid #8b5cf6; }
        .summary-card .value { font-size: 2.5rem; font-weight: 700; line-height: 1; }
        .summary-card .label { font-size: 0.875rem; color: #666; text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.5rem; }
        .summary-card.passed .value { color: #22c55e; }
        .summary-card.failed .value { color: #ef4444; }
        .summary-card.errors .value { color: #f97316; }
        .section { background: white; border-radius: 12px; padding: 1.5rem; margin-bottom: 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .section h2 { font-size: 1.25rem; font-weight: 600; margin-bottom: 1rem; color: #1a1a2e; }
        .results-table { width: 100%; border-collapse: collapse; }
        .results-table th, .results-table td { padding: 0.75rem 1rem; text-align: left; border-bottom: 1px solid #e5e7eb; }
        .results-table th { font-weight: 600; color: #374151; background: #f9fafb; }
        .results-table tr:hover { background: #f9fafb; }
        .badge { display: inline-flex; align-items: center; padding: 0.25rem 0.75rem; border-radius: 9999px; font-size: 0.75rem; font-weight: 600; text-transform: uppercase; }
        .badge-passed { background: #dcfce7; color: #166534; }
        .badge-failed { background: #fee2e2; color: #991b1b; }
        .badge-error { background: #ffedd5; color: #9a3412; }
        .badge-skipped { background: #f3f4f6; color: #374151; }
        .badge-low { background: #dcfce7; color: #166534; }
        .badge-medium { background: #fef3c7; color: #92400e; }
        .badge-high { background: #fee2e2; color: #991b1b; }
        .badge-critical { background: #fecaca; color: #7f1d1d; }
        .disclaimer { background: #fef3c7; border: 1px solid #fcd34d; border-radius: 8px; padding: 1rem; margin-top: 2rem; color: #92400e; font-size: 0.875rem; }
        .disclaimer strong { display: block; margin-bottom: 0.5rem; }
        .endpoint-section { margin-bottom: 1.5rem; }
        .endpoint-section h3 { font-size: 1rem; font-weight: 600; color: #1a1a2e; margin-bottom: 0.75rem; padding-bottom: 0.5rem; border-bottom: 1px solid #e5e7eb; }
        .result-detail { background: #f9fafb; border-radius: 8px; padding: 1rem; margin-bottom: 0.75rem; font-size: 0.875rem; }
        .result-detail pre { background: #1e1e1e; color: #d4d4d4; padding: 0.75rem; border-radius: 6px; overflow-x: auto; margin-top: 0.5rem; font-size: 0.75rem; }
        @media print {
            .container { padding: 0; }
            .section { break-inside: avoid; }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
